<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Research Project | University Research</title>

    <style>
        /* =========================================================
           UNIVERSITY RESEARCH WEBSITE
           Edit the colors, text, and sections to fit your project.
           ========================================================= */

        :root {
            --navy: #17365d;
            --dark-navy: #10253f;
            --blue: #2f6f9f;
            --light-blue: #eaf2f8;
            --gold: #c9a227;
            --dark-gray: #333333;
            --medium-gray: #666666;
            --light-gray: #f4f5f7;
            --border: #d9dde3;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Georgia, "Times New Roman", serif;
            color: var(--dark-gray);
            background-color: var(--light-gray);
            line-height: 1.7;
        }

        /* =========================================================
           TOP UNIVERSITY BAR
           ========================================================= */

        .university-bar {
            background-color: var(--dark-navy);
            color: white;
            padding: 10px 20px;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 0.9rem;
        }

        .university-bar .container {
            max-width: 1180px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* =========================================================
           HEADER
           ========================================================= */

        header {
            background-color: var(--white);
            border-bottom: 1px solid var(--border);
        }

        .header-content {
            max-width: 1180px;
            margin: auto;
            padding: 35px 20px;
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .university-logo {
            width: 80px;
            height: 80px;
            border: 3px solid var(--navy);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--navy);
            font-family: Arial, Helvetica, sans-serif;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .header-text h1 {
            color: var(--navy);
            font-size: 2.2rem;
            line-height: 1.2;
            margin-bottom: 8px;
        }

        .header-text p {
            color: var(--medium-gray);
            font-family: Arial, Helvetica, sans-serif;
            font-size: 1rem;
        }

        /* =========================================================
           NAVIGATION
           ========================================================= */

        nav {
            background-color: var(--navy);
            font-family: Arial, Helvetica, sans-serif;
        }

        .nav-container {
            max-width: 1180px;
            margin: auto;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 14px 18px;
            font-size: 0.9rem;
            transition: background-color 0.2s;
        }

        nav a:hover {
            background-color: var(--blue);
        }

        /* =========================================================
           PAGE LAYOUT
           ========================================================= */

        .page-container {
            max-width: 1180px;
            margin: 35px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 35px;
        }

        main {
            min-width: 0;
        }

        /* =========================================================
           SECTIONS
           ========================================================= */

        .section {
            background-color: var(--white);
            padding: 35px;
            margin-bottom: 30px;
            border: 1px solid var(--border);
        }

        .section-title {
            color: var(--navy);
            font-size: 1.7rem;
            border-bottom: 2px solid var(--gold);
            padding-bottom: 10px;
            margin-bottom: 22px;
        }

        .section p {
            margin-bottom: 16px;
        }

        /* =========================================================
           INTRODUCTION
           ========================================================= */

        .intro {
            border-top: 5px solid var(--navy);
        }

        .intro-lead {
            font-size: 1.2rem;
            color: #444;
            margin-bottom: 20px;
        }

        /* =========================================================
           RESEARCH QUESTIONS
           ========================================================= */

        .question {
            background-color: var(--light-blue);
            border-left: 4px solid var(--blue);
            padding: 18px 20px;
            margin-bottom: 15px;
        }

        .question strong {
            color: var(--navy);
        }

        /* =========================================================
           RESEARCHER INFORMATION
           ========================================================= */

        .researcher {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .researcher-photo {
            width: 90px;
            height: 90px;
            background-color: var(--light-blue);
            border: 1px solid var(--border);
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--blue);
            font-family: Arial, Helvetica, sans-serif;
            font-size: 0.8rem;
            text-align: center;
        }

        .researcher h3 {
            color: var(--navy);
            margin-bottom: 4px;
        }

        .researcher p {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 0.9rem;
            color: var(--medium-gray);
        }

        /* =========================================================
           METHODS
           ========================================================= */

        .method-list {
            list-style: none;
        }

        .method-list li {
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }

        .method-list li:last-child {
            border-bottom: none;
        }

        .method-number {
            display: inline-block;
            width: 30px;
            height: 30px;
            line-height: 30px;
            text-align: center;
            background-color: var(--navy);
            color: white;
            border-radius: 50%;
            margin-right: 10px;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 0.8rem;
        }

        /* =========================================================
           STATISTICS / KEY FINDINGS
           ========================================================= */

        .statistics {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 25px 0;
        }

        .stat {
            background-color: var(--navy);
            color: white;
            text-align: center;
            padding: 25px 10px;
        }

        .stat-number {
            display: block;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 2rem;
            font-weight: bold;
            color: white;
            margin-bottom: 5px;
        }

        .stat-label {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 0.8rem;
            color: #dce6ef;
        }

        /* =========================================================
           FIGURE / DATA PLACEHOLDER
           ========================================================= */

        .figure {
            margin: 25px 0;
        }

        .figure-placeholder {
            height: 280px;
            background:
                linear-gradient(135deg, #eef3f7, #dfe8ef);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: var(--medium-gray);
            font-family: Arial, Helvetica, sans-serif;
        }

        .figure-caption {
            font-size: 0.9rem;
            color: var(--medium-gray);
            margin-top: 8px;
        }

        /* =========================================================
           REFERENCES
           ========================================================= */

        .references {
            font-size: 0.95rem;
        }

        .reference {
            padding-left: 30px;
            text-indent: -30px;
            margin-bottom: 14px;
        }

        /* =========================================================
           SIDEBAR
           ========================================================= */

        aside {
            font-family: Arial, Helvetica, sans-serif;
        }

        .sidebar-box {
            background-color: white;
            border: 1px solid var(--border);
            margin-bottom: 25px;
        }

        .sidebar-title
